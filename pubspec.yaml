name: covert_audio
description: A Flutter mobile application for covert message communication using audio steganography and AES-256-GCM encryption.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  material_color_utilities: ^0.5.0
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # Audio Handling
  flutter_sound: ^9.2.13
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  audio_waveforms: ^1.0.5
  
  # File Management
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  
  # Cryptography
  cryptography: ^2.5.0
  pointycastle: ^3.7.3
  crypto: ^3.0.3
  
  # Security & Authentication
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0
  
  # Sharing & Communication
  share_plus: ^7.2.1
  
  # Utilities
  uuid: ^4.2.1
  intl: ^0.18.1
  package_info_plus: ^4.2.0
  
  # Cloud Storage (Optional)
  googleapis: ^11.4.0
  firebase_core: ^2.24.2
  firebase_storage: ^11.5.6
  
  # UI Enhancements
  flutter_spinkit: ^5.2.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  
  # Development
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
